spring:
  application:
    name: wealth-bss
  sql:
    init:
      mode: never
  data:
    redis:
      url: ${REDIS_URL:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # "never" by default - a health breakdown (db/redis up/down, driver names) is useful for local dev
      # dashboards but not something to expose publicly without thought. Override per-environment.
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      show-components: ${MANAGEMENT_HEALTH_SHOW_COMPONENTS:always}

wealth:
  jdbc:
    url: ${WEALTH_JDBC_URL:}
    username: ${WEALTH_DB_USERNAME:}
    password: ${WEALTH_DB_PASSWORD:}
    pool-size: ${WEALTH_DB_POOL_SIZE:5}
  session:
    secret: ${WEALTH_SESSION_SECRET:}
  access:
    key: ${WEALTH_ACCESS_KEY:}
  nexus-cache:
    namespace: ${WEALTH_NEXUS_CACHE_NAMESPACE:wealth:nexus}
    ttl-seconds: ${WEALTH_NEXUS_CACHE_TTL_SECONDS:300}

# Embedded growx-common closure (Interceptor/CommonRepository/feign clients) config. wealth has no real
# Customers-service or multi-schema tenancy, so these are placeholders that let the beans start, not live
# integrations - see docs/business/index.md Architecture Gap.
default:
  schema: ${DEFAULT_SCHEMA:public}
  isProd: ${DEFAULT_IS_PROD:false}
karthi:
  appmaster-schema: ${KARTHI_APPMASTER_SCHEMA:public}
  customers-service:
    url: ${KARTHI_CUSTOMERS_SERVICE_URL:http://localhost:9999}
  nexusService:
    name: ${KARTHI_NEXUS_SERVICE_NAME:wealth-nexus-placeholder}
    url: ${KARTHI_NEXUS_SERVICE_URL:http://localhost:9999}
  security-headers:
    content-security-policy: "${KARTHI_SECURITY_CSP:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'}"
resttemplate:
  connect:
    timeout: ${RESTTEMPLATE_CONNECT_TIMEOUT:25000}
  read:
    timeout: ${RESTTEMPLATE_READ_TIMEOUT:25000}
cors:
  mapping: ${CORS_MAPPING:/**}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  issuer: ${JWT_ISSUER:wealth-bss}
  access-token-lifetime-seconds: ${JWT_ACCESS_TOKEN_LIFETIME_SECONDS:3600}

---
spring:
  config:
    activate:
      on-profile: dev
wealth:
  environment: development

---
spring:
  config:
    activate:
      on-profile: prod
wealth:
  environment: production
