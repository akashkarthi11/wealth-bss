spring.application.name=wealth-bss
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Existing Neon PostgreSQL database; configure WEALTH_JDBC_URL as a JDBC URL.
spring.datasource.url=${WEALTH_JDBC_URL:}
spring.datasource.username=${WEALTH_DB_USERNAME:}
spring.datasource.password=${WEALTH_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${WEALTH_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
