
spring.data.redis.url=${REDIS_URL}
wealth.jdbc.url=${WEALTH_JDBC_URL}
wealth.jdbc.username=${WEALTH_DB_USERNAME}
wealth.jdbc.password=${WEALTH_DB_PASSWORD}
wealth.jdbc.pool-size=${WEALTH_DB_POOL_SIZE:3}
wealth.jdbc.connection-timeout-ms=20000
wealth.session.secret=${WEALTH_SESSION_SECRET}
wealth.access.key=${WEALTH_ACCESS_KEY}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://140.245.251.65}
management.endpoint.health.show-details=never
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.security.protocol=SASL_SSL
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=${KAFKA_CA_PATH:}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
