name: Build and test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Build Docker image (CI smoke test)
        run: docker build -t wealth-bss:ci .
