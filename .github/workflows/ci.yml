name: Build, test and publish BSS image (no deploy)

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: akashkarthi11/wealth-common
          ref: development
          path: wealth-common
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install shared library from source
        run: mvn -B -f wealth-common/pom.xml install -DskipTests
      - name: Build and test
        run: mvn -B clean verify
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64 image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMMON_CACHE_BUST=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:development
            ghcr.io/${{ github.repository }}:${{ github.sha }}
