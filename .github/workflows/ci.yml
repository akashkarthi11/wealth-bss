name: Build, test, publish and deploy BSS

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ runner.temp }}
      - name: Build and test
        run: mvn -B clean verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64 image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:development
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured SSH host fingerprint
        env:
          CONFIGURED_FINGERPRINT: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
        run: |
          EXPECTED_FINGERPRINT='SHA256:D4qwc2obm5GrMxueJhxpoE0fmDmdYDUnXPwAzmpispQ'
          if [ "$CONFIGURED_FINGERPRINT" = "$EXPECTED_FINGERPRINT" ]; then
            echo "SSH fingerprint secret exactly matches the verified ECDSA host key."
          else
            echo "::error::ORACLE_HOST_FINGERPRINT does not exactly match the verified ECDSA host key."
            exit 1
          fi
      - name: Deploy BSS to Oracle VM
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          SPRING_PROFILES_ACTIVE: dev
          WEALTH_JDBC_URL: ${{ secrets.WEALTH_JDBC_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WEALTH_SESSION_SECRET: ${{ secrets.WEALTH_SESSION_SECRET }}
          WEALTH_ACCESS_KEY: ${{ secrets.WEALTH_ACCESS_KEY }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          envs: IMAGE,SPRING_PROFILES_ACTIVE,WEALTH_JDBC_URL,REDIS_URL,WEALTH_SESSION_SECRET,WEALTH_ACCESS_KEY
          script: |
            set -eu
            test -n "$WEALTH_JDBC_URL" || { echo "Missing WEALTH_JDBC_URL secret"; exit 1; }
            test -n "$REDIS_URL" || { echo "Missing REDIS_URL secret"; exit 1; }
            test -n "$WEALTH_SESSION_SECRET" || { echo "Missing WEALTH_SESSION_SECRET secret"; exit 1; }
            test -n "$WEALTH_ACCESS_KEY" || { echo "Missing WEALTH_ACCESS_KEY secret"; exit 1; }
            sudo docker pull "$IMAGE"
            sudo docker rm -f wealth-bss 2>/dev/null || true
            sudo docker run -d --name wealth-bss --restart unless-stopped --memory=400m --cpus=0.7 \
              -e SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              -p 127.0.0.1:8080:8080 \
              -e JAVA_TOOL_OPTIONS="-Xms128m -Xmx256m" \
              -e WEALTH_JDBC_URL="$WEALTH_JDBC_URL" \
              -e SPRING_DATA_REDIS_URL="$REDIS_URL" \
              -e WEALTH_SESSION_SECRET="$WEALTH_SESSION_SECRET" \
              -e WEALTH_ACCESS_KEY="$WEALTH_ACCESS_KEY" \
              "$IMAGE"
            echo "wealth-bss container started with configured development database and Redis."
